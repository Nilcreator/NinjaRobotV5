[project]
name = "pi0disp"
version = "2.0.0"
description = "ST7789V display driver for Raspberry Pi with smart delta rendering."
authors = [
    {name = "NinjaRobot Team"},
]
dependencies = [
    "click",
    "numpy",
    "pillow",
]
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}

[project.optional-dependencies]
pi = [
    "pigpio",
]
ninjarobot = [
    "ninja_utils",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
pi0disp = "pi0disp.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
