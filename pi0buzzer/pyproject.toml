[project]
name = "pi0buzzer"
version = "1.0.0"
description = "A non-blocking passive buzzer driver for Raspberry Pi with musical note support."
authors = [
    {name = "Nil Creator", email = "nilcreator@gmail.com"},
]
dependencies = [
    "pigpio",
    "click",
]
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}

[project.optional-dependencies]
ninjarobot = [
    "ninja_utils",
]
dev = [
    "pytest>=7.0",
    "ruff",
]

[project.scripts]
pi0buzzer = "pi0buzzer.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
